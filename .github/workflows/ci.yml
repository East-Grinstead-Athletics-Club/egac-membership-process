name: CI

on:
  push:
    branches-ignore:
      - main
      - staging
  pull_request:
    branches:
      - staging
      - main

jobs:
  # ----------------------------------------------------------------
  # install
  # ----------------------------------------------------------------
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache node_modules for subsequent jobs in this workflow run
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ----------------------------------------------------------------
  # lint
  # ----------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ----------------------------------------------------------------
  # format-check
  # ----------------------------------------------------------------
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  # ----------------------------------------------------------------
  # test
  # ----------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    env:
      # Provide dummy values so modules that read env don't crash
      RESEND_API_KEY: test_key_ci
      CRON_SECRET: test_cron_ci
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify test count
        # Fail the build if fewer than 50 tests pass
        run: |
          npm test -- --reporter=json 2>/dev/null | node -e "
            const chunks = [];
            process.stdin.on('data', c => chunks.push(c));
            process.stdin.on('end', () => {
              try {
                const data = JSON.parse(chunks.join(''));
                const passed = data.numPassedTests ?? 0;
                console.log('Tests passed:', passed);
                if (passed < 50) {
                  console.error('FAIL: fewer than 50 tests passing (' + passed + ')');
                  process.exit(1);
                }
                console.log('OK: test count requirement met');
              } catch(e) {
                console.error('FAIL: could not parse test report JSON');
                process.exit(1);
              }
            });
          "

  # ----------------------------------------------------------------
  # build
  # ----------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, format-check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # Build step added once astro.config.mjs exists
      # - name: Build
      #   run: npm run build
