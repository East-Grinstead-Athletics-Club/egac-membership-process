name: Deploy — Production

on:
  push:
    branches:
      - main

jobs:
  # ----------------------------------------------------------------
  # ci — full checks on every push to main
  # Cloudflare Pages auto-deploys from the GitHub integration;
  # this workflow validates code quality and confirms the live
  # deployment is healthy after Pages finishes.
  # ----------------------------------------------------------------
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: test_key_ci
      CRON_SECRET: test_cron_ci
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  # ----------------------------------------------------------------
  # smoke-test-production
  # Waits for Cloudflare Pages to finish deploying (triggered by
  # the same push via the GitHub integration), then hits /api/health.
  # ----------------------------------------------------------------
  smoke-test-production:
    name: Smoke test (production)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Wait for Cloudflare Pages deployment
        run: sleep 60

      - name: Health check
        run: |
          URL="${{ secrets.PAGES_SITE_URL }}/api/health"
          echo "Checking $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"

  # ----------------------------------------------------------------
  # notify-on-failure
  # Opens a GitHub issue if CI or smoke test fails.
  # ----------------------------------------------------------------
  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [ci, smoke-test-production]
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Production deploy failed — ${context.sha.slice(0,7)}`,
              body: [
                `Production CI or smoke test failed.`,
                '',
                `**Commit:** ${context.sha}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Check the Actions log for details.',
              ].join('\n'),
              labels: ['deploy-failure'],
            });
