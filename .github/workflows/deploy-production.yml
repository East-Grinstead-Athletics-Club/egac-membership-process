name: Deploy — Production

on:
  push:
    branches:
      - main

jobs:
  # ----------------------------------------------------------------
  # ci — full checks before any production deployment
  # ----------------------------------------------------------------
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: test_key_ci
      CRON_SECRET: test_cron_ci
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Type check
        run: npm run type-check

  # ----------------------------------------------------------------
  # migrate-d1-production
  # ----------------------------------------------------------------
  migrate-d1-production:
    name: Migrate D1 (production)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run initial schema migration
        run: |
          npx wrangler d1 execute egac \
            --remote \
            --file=db/migrations/0001_initial_schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Run seed data
        run: |
          npx wrangler d1 execute egac \
            --remote \
            --file=db/seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ----------------------------------------------------------------
  # deploy-production
  # ----------------------------------------------------------------
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: migrate-d1-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Uncomment once astro.config.mjs exists
      # - name: Build
      #   run: npm run build

      - name: Deploy to Cloudflare Pages (production)
        run: |
          npx wrangler pages deploy dist/ \
            --project-name=egac \
            --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ----------------------------------------------------------------
  # smoke-test-production
  # ----------------------------------------------------------------
  smoke-test-production:
    name: Smoke test (production)
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Health check
        run: |
          echo "Checking ${{ secrets.PAGES_SITE_URL }}/api/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.PAGES_SITE_URL }}/api/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Health check failed — notifying ${{ secrets.MONITORING_MENTION }}"
            echo "Deploy may have failed. Status: $STATUS" 
            exit 1
          fi
          echo "Health check passed"

  # ----------------------------------------------------------------
  # notify-on-failure
  # Opens a GitHub issue if production deploy fails
  # ----------------------------------------------------------------
  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [ci, migrate-d1-production, deploy-production, smoke-test-production]
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const mention = '${{ secrets.MONITORING_MENTION }}' || '@team';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Production deploy failed — ${context.sha.slice(0,7)}`,
              body: [
                `${mention} — production deployment failed.`,
                '',
                `**Commit:** ${context.sha}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Please investigate before the next deployment.',
              ].join('\n'),
              labels: ['deploy-failure'],
            });
