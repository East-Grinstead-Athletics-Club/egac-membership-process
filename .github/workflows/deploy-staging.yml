name: Deploy — Staging

on:
  push:
    branches:
      - staging

jobs:
  # ----------------------------------------------------------------
  # ci — run full checks before deploying
  # ----------------------------------------------------------------
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: test_key_ci
      CRON_SECRET: test_cron_ci
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Type check
        run: npm run type-check

  # ----------------------------------------------------------------
  # migrate-d1-staging
  # Runs D1 migrations against the staging database.
  # Idempotent — CREATE IF NOT EXISTS throughout.
  # ----------------------------------------------------------------
  migrate-d1-staging:
    name: Migrate D1 (staging)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run initial schema migration
        run: |
          npx wrangler d1 execute egac-staging \
            --env staging \
            --remote \
            --file=db/migrations/0001_initial_schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Run seed data
        # Only seeds if tables are empty — INSERT OR IGNORE in seed.sql
        run: |
          npx wrangler d1 execute egac-staging \
            --env staging \
            --remote \
            --file=db/seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ----------------------------------------------------------------
  # deploy-staging
  # Deploys to Cloudflare Pages staging project.
  # ----------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: migrate-d1-staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Uncomment once astro.config.mjs exists
      # - name: Build
      #   run: npm run build

      - name: Deploy to Cloudflare Pages (staging)
        run: |
          npx wrangler pages deploy dist/ \
            --project-name=egac-staging \
            --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ----------------------------------------------------------------
  # smoke-test-staging
  # Hits /api/health after deploy to confirm the Worker is up.
  # ----------------------------------------------------------------
  smoke-test-staging:
    name: Smoke test (staging)
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Health check
        run: |
          echo "Checking ${{ secrets.STAGING_SITE_URL }}/api/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.STAGING_SITE_URL }}/api/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"
