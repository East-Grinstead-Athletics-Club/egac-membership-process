name: Deploy — Staging

on:
  push:
    branches:
      - staging

jobs:
  # ----------------------------------------------------------------
  # ci — full checks before staging deployment
  # Cloudflare Pages auto-deploys the staging branch via the
  # GitHub integration. This workflow validates quality and confirms
  # the deployment is healthy.
  # ----------------------------------------------------------------
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: test_key_ci
      CRON_SECRET: test_cron_ci
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  # ----------------------------------------------------------------
  # smoke-test-staging
  # ----------------------------------------------------------------
  smoke-test-staging:
    name: Smoke test (staging)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Wait for Cloudflare Pages deployment
        run: sleep 60

      - name: Health check
        run: |
          URL="${{ secrets.STAGING_SITE_URL }}/api/health"
          echo "Checking $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"
