# ----------------------------------------------------------------
# EGAC Cron Worker
# Standalone Worker that triggers scheduled jobs in the Pages project
# via HTTP. Required because Cloudflare Pages does not support
# [triggers] / cron expressions in wrangler.toml.
#
# Deploy:
#   cd workers/cron
#   npx wrangler deploy
#
# Secrets (set once):
#   npx wrangler secret put CRON_SECRET
# ----------------------------------------------------------------
name = "egac-cron"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
PAGES_URL = "https://egac.pages.dev"

[triggers]
crons = [
  "0 9 * * *",
  "0 18 * * 2",
  "*/30 * * * *",
  "0 9 1 * *"
]
