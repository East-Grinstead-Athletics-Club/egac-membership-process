# ----------------------------------------------------------------
# Project: eastgrinsteadac.co.uk
# Pages build output
# ----------------------------------------------------------------
name = "egac-membership"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# ----------------------------------------------------------------
# Cloudflare account + API token for production
# Use environment variable for token
# ----------------------------------------------------------------
# Auth: set CLOUDFLARE_API_TOKEN in your environment (wrangler reads this automatically)

# ----------------------------------------------------------------
# Environment variables (non-secret)
# Secrets (RESEND_API_KEY, ADMIN_TOKEN, CRON_SECRET) must be set via:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put CRON_SECRET
# ----------------------------------------------------------------
[vars]
APP_ENV = "production"
EMAIL_FROM = "noreply@updates.eastgrinsteadac.co.uk"
SITE_URL = "https://egac-membership.pages.dev"

# ----------------------------------------------------------------
# D1 Database
# ----------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "egac"
database_id = "6a053384-20ee-4fee-bf73-aa29c1779fe3"

# ----------------------------------------------------------------
# KV Namespace
# ----------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"
id = "28ecc4df31b44e5e92cc4730c1870829"

# ================================================================
# Cron Triggers — Configured via wrangler-cron.toml
# ================================================================
# Native Cloudflare Cron Triggers are configured in a separate
# wrangler-cron.toml file that deploys the scheduled worker.
# See wrangler-cron.toml for trigger definitions:
#   0 9 * * *      Daily 09:00 UTC: expire stale invites
#   0 18 * * 2     Tue 18:00 UTC: booking reminders
#   */30 * * * *   Every 30 min: retry pending invite sends
#   0 9 1 * *      1st of month 09:00 UTC: academy season rollover
#
# Deploy with:
#   wrangler deploy --config wrangler-cron.toml
# ================================================================